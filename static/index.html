<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>语料标注与仲裁</title>
<style>body{font:15px system-ui;max-width:1080px;margin:24px auto;padding:0 16px;background:#f6f7f9}section{background:#fff;padding:16px;margin:12px 0;border:1px solid #ddd;border-radius:10px}input,textarea,select,button{padding:7px;margin:3px;border:1px solid #bbb;border-radius:6px}button{background:#235347;color:#fff}pre{white-space:pre-wrap;max-height:360px;overflow:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.grid input,.grid textarea{width:90%}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ddd;padding:5px 7px;text-align:left;vertical-align:top}.pending{color:#b3541f;font-weight:600}.done{color:#235347;font-weight:600}</style>
<h1>语料标注与争议仲裁</h1><section><button onclick="load()">刷新状态</button><pre id="state"></pre></section>
<section><h2>标注与讨论</h2><div class="grid"><input id="item" type="number" placeholder="条目 ID"><input id="user" type="number" placeholder="用户 ID"><input id="label" placeholder="标签"><textarea id="comment" placeholder="备注"></textarea><input id="batch" type="number" placeholder="批次 ID"><input id="manager" type="number" placeholder="管理员 ID"></div>
<button onclick="annotate()">提交标注/返工重提</button><button onclick="loadItem()">查看条目与待返工</button><button onclick="disagreements()">查看分歧</button><button onclick="consistency()">一致性</button><button onclick="freeze()">冻结金标准</button><button onclick="exportGold()">导出金标准</button><pre id="result"></pre></section>
<section><h2>仲裁</h2><input id="arb" type="number" placeholder="仲裁员 ID"><input id="final" placeholder="最终标签"><input id="reason" placeholder="理由至少5字"><button onclick="adjudicate()">提交仲裁</button></section>
<section><h2>抽检返工</h2>
<div class="grid"><input id="rw_item" type="number" placeholder="已提交标注的条目 ID"><input id="rw_annotator" type="number" placeholder="标注员 ID"><input id="rw_manager" type="number" placeholder="管理员 ID"><textarea id="rw_reason" placeholder="返工意见（必填）"></textarea></div>
<button onclick="createRework()">管理员发起返工</button>
<div style="margin-top:10px">筛选：
<select id="rw_status"><option value="">全部记录</option><option value="pending">待处理</option><option value="done">已处理</option></select>
<input id="rw_batch" type="number" placeholder="批次 ID（可选）" style="width:160px">
<button onclick="listReworks()">查询返工记录</button>
</div>
<table style="margin-top:10px"><thead><tr><th>ID</th><th>批次</th><th>条目</th><th>标注员</th><th>原标签</th><th>新标签</th><th>抽检原因</th><th>发起时间</th><th>完成时间</th><th>状态</th></tr></thead><tbody id="rw_rows"></tbody></table>
</section>
<script>
const result=document.querySelector('#result');
const show=x=>result.textContent=JSON.stringify(x,null,2);
async function get(u){return show(await(await fetch(u)).json())}
async function post(u,b){const r=await(await fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(b)})).json();show(r);return r}
async function load(){show(await(await fetch('/api/state')).json())}
function annotate(){post('/api/annotations',{item_id:+item.value,annotator_id:+user.value,label:label.value,comment:comment.value})}
function loadItem(){get('/api/items/'+item.value+'?user_id='+user.value)}
function disagreements(){get('/api/batches/'+batch.value+'/disagreements')}
function consistency(){get('/api/batches/'+batch.value+'/consistency')}
function adjudicate(){post('/api/adjudications',{item_id:+item.value,arbitrator_id:+arb.value,final_label:final.value,reason:reason.value})}
function freeze(){post('/api/batches/'+batch.value+'/freeze',{manager_id:+manager.value})}
function exportGold(){get('/api/batches/'+batch.value+'/gold')}
async function createRework(){const r=await post('/api/reworks',{item_id:+rw_item.value,annotator_id:+rw_annotator.value,manager_id:+rw_manager.value,reason:rw_reason.value});if(r.ok)listReworks()}
function esc(s){return String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
async function listReworks(){
  const p=new URLSearchParams();
  if(rw_status.value)p.set('status',rw_status.value);
  if(rw_batch.value)p.set('batch_id',rw_batch.value);
  const data=await(await fetch('/api/reworks?'+p.toString())).json();
  show(data);
  rw_rows.innerHTML=(data.reworks||[]).map(r=>'<tr><td>'+r.id+'</td><td>'+r.batch_id+'</td><td>#'+r.ordinal+'</td><td>'+esc(r.annotator_name)+'</td><td>'+esc(r.previous_label)+'</td><td>'+esc(r.new_label)+'</td><td>'+esc(r.reason)+'</td><td>'+esc(r.created_at)+'</td><td>'+esc(r.completed_at)+'</td><td class="'+r.status+'">'+(r.status==='pending'?'待处理':'已处理')+'</td></tr>').join('');
}
load();listReworks();
</script>
</html>
